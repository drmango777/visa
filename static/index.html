<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sail-by</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --ink:#12303A; --muted:#4f6168; --line:#DAD8D0; --line-2:#C9C6BC; --bg:#F7F5F0; --surface:#FFFDF9; --skel:#E7E4DC;
  --blue:#1D5FD1; --blue-d:#164AA6; --water:#DCE7F3; --link:#1D5FD1; --heat:#B33A0B; --good:#17704a; --head:64px; --r:3px;
  --display:"Archivo", "Arial Narrow", "Public Sans", sans-serif; }
* { box-sizing: border-box; }
html { font-size: 18px; }
body { margin: 0; color: var(--ink); background: var(--bg); line-height: 1.5; font-family: "Public Sans", "Segoe UI", Arial, sans-serif; }
h1 { font-size: 2.2rem; line-height: 1.1; letter-spacing: -.01em; margin: 0 0 .5rem; font-weight: 800; }
h2 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 .5rem; font-weight: 700; }
h3 { font-size: 1.05rem; margin: 1.2rem 0 .3rem; }
p { margin: 0 0 .7rem; }
a { color: var(--link); }
a:hover { color: var(--blue-d); }
:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
.hint { color: var(--muted); font-size: .9rem; }
.lead { color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
[hidden] { display: none !important; }
@media (max-width: 600px) { h1 { font-size: 1.8rem; } }

/* top bar: tabs sit in the header on wide screens, and in a bar at the bottom on smaller ones */
.top { position: sticky; top: 0; z-index: 1100; border-bottom: 1px solid var(--line); background: var(--surface); }
.bar { display: flex; align-items: center; gap: 20px; height: var(--head); padding: 0 20px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--ink); text-decoration: none; margin-right: auto; }
.brand:hover { color: var(--ink); }
.tabs { display: flex; height: 100%; }
.tab { height: 100%; padding: 0 14px; font: inherit; font-size: .95rem; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; border-top: 3px solid transparent; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--blue); }
.tab .short { display: none; }
.langs { display: flex; border: 1px solid var(--ink); border-radius: var(--r); flex: none; }
.langs button { min-height: 36px; padding: 0 10px; font: inherit; font-size: .8rem; font-weight: 600; color: var(--ink); background: transparent; border: 0; cursor: pointer; }
.langs button + button { border-left: 1px solid var(--ink); }
.langs button:hover { background: var(--bg); }
.langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
/* smaller screens: logo and languages on the first row, the four tabs on a second row under them */
@media (max-width: 1080px) {
  :root { --head: 108px; }
  .tab .short { display: inline; } .tab .long { display: none; }
  .bar { flex-wrap: wrap; height: auto; padding: 0 16px; gap: 0 12px; }
  .brand, .langs { height: 56px; }
  .langs { height: 36px; }
  .tabs { order: 3; width: calc(100% + 32px); margin: 0 -16px; height: 52px; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .tab { height: 52px; padding: 4px; font-size: .82rem; line-height: 1.15; border-top: 0; }
}
@media (max-width: 420px) { .bar { padding: 0 12px; gap: 0 8px; } .tabs { width: calc(100% + 24px); margin: 0 -12px; } .brand { font-size: 1.15rem; gap: 6px; } .brand svg { width: 22px; } .langs button { padding: 0 7px; font-size: .74rem; } .tab { font-size: .76rem; } }

/* forms */
label, .label { display: block; font-weight: 700; margin: 1.1rem 0 .3rem; }
input[type=text], input[type=date], input[type=time], select, textarea { width: 100%; min-height: 52px; font: inherit; color: var(--ink); padding: .5rem .9rem; border: 1px solid var(--ink); border-radius: var(--r); background: #fff; }
textarea { resize: vertical; line-height: 1.4; }
button.primary { min-height: 52px; font: inherit; font-weight: 700; color: #fff; background: var(--blue); border: 0; border-radius: var(--r); padding: .4rem 1.8rem; cursor: pointer; }
button.primary:hover { background: var(--blue-d); }
button.primary[disabled] { opacity: .6; cursor: wait; }
button.plain { min-height: 46px; font: inherit; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: var(--r); padding: .2rem 1.1rem; cursor: pointer; }
button.plain:hover { background: var(--surface); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 46px; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: var(--r); padding: .2rem .9rem; cursor: pointer; }
.seg button:hover { background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
.error { background: #FBEAE3; color: #7a2a06; padding: .8rem 1rem; border: 1px solid #E9B9A5; border-radius: var(--r); margin-top: 1rem; }
.notice { background: var(--surface); border: 1px solid var(--line); padding: .8rem 1rem; border-radius: var(--r); margin: 1rem 20px; }

/* loading placeholders */
.skel { display: block; height: .95em; margin: .55em 0; border-radius: 2px; background: var(--skel); animation: pulse 1.4s ease-in-out infinite; }
.skel.big { height: 1.5em; margin-bottom: .8em; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* landing page */
/* the landing page fills one screen: the map on top, the four options along the bottom */
#p-home:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head) - 1px); }
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--ink); flex: 1; min-height: 200px; display: flex; align-items: flex-end; background: var(--water); }
.hero svg.map { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* the map is kept light so the dark words on top always read clearly */
.map .land { fill: var(--bg); stroke: #c9d6e4; stroke-width: 1; vector-effect: non-scaling-stroke; }
.map .river { fill: none; stroke: var(--water); stroke-width: 3.5; vector-effect: non-scaling-stroke; }
.map .road { fill: none; stroke: var(--ink); stroke-opacity: .2; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.map .bus { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-opacity: .13; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
  stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 20s ease-in-out infinite; animation-delay: var(--delay); }
/* each route draws itself in, stays a moment, then wipes away the same direction, and starts again */
@keyframes draw { 0% { stroke-dashoffset: var(--len); } 45%, 65% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: calc(var(--len) * -1); } }
@media (prefers-reduced-motion: reduce) { .map .bus { animation: none; stroke-dashoffset: 0; } }
.hero-in { position: relative; width: 100%; max-width: 1200px; margin: 0 auto; padding: 40px 28px 30px; }
.hero h1 { font-family: var(--display); font-stretch: 72%; font-weight: 900; font-size: clamp(3rem, min(9vw, 14vh), 8.5rem); line-height: .92; letter-spacing: -.01em; text-transform: uppercase; margin: 0 0 .9rem; }
.hero h1 .accent { color: var(--blue); }
.rot { display: grid; }
.rot > span { grid-area: 1 / 1; opacity: 0; transition: opacity .3s ease; }
.rot > span.on { opacity: 1; transition-delay: .3s; }   /* the old line fades out first, then the new one fades in */
.hero .lead { font-size: clamp(1rem, 1.6vw, 1.2rem); font-weight: 600; color: var(--ink); max-width: 40ch; margin: 0; }
.options { width: 100%; max-width: 1200px; margin: 0 auto; padding: 18px 28px 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.options button { display: flex; flex-direction: column; gap: 10px; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--ink); border-radius: var(--r); padding: 16px 18px; cursor: pointer; }
.options button:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.options button:hover .num, .options button:hover span { color: #dbe6fb; }
.options .num { font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: .9rem; color: var(--blue); }
.options b { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: clamp(1.25rem, 2vw, 1.7rem); line-height: 1.02; text-transform: uppercase; }
.options span { display: block; color: var(--muted); font-size: .88rem; line-height: 1.35; margin-top: 6px; }
@media (max-width: 900px) { .options { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) {
  .hero { min-height: 200px; } .hero-in { padding: 24px 16px 18px; }
  .hero h1 { font-size: clamp(2.6rem, 14vw, 3.8rem); }
  .options { padding: 12px 12px 14px; gap: 8px; }
  .options button { padding: 12px 12px; gap: 4px; }
  .options b { font-size: 1.12rem; }
  .options span { font-size: .8rem; }
  .options .num { display: none; }
}

/* page heading row */
.pagehead { border-bottom: 1px solid var(--line); }
.pagehead-in { max-width: 1400px; margin: 0 auto; padding: 34px 28px 26px; }
.pagehead .lead { margin: 0; }
@media (max-width: 600px) { .pagehead-in { padding: 24px 20px 18px; } }

/* layouts */
.askwrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; }
.twocol { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); min-height: calc(100vh - var(--head)); }
.left { padding: 28px 28px 56px; }
.right { background: var(--surface); border-left: 1px solid var(--line); padding: 36px 48px 64px; min-width: 0; }
.right .inner { max-width: 720px; }
.areagrid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); grid-template-areas: "form map" "results map"; }
.form { grid-area: form; padding: 28px 28px 0; }
.results { grid-area: results; padding: 0 28px 56px; }
.mapcol { grid-area: map; position: sticky; top: var(--head); align-self: start; height: calc(100vh - var(--head)); background: #E8E6E0; overflow: hidden; border-left: 1px solid var(--line); }
#map, #map-leaflet { position: absolute; inset: 0; }
#map-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; color: var(--muted); font-size: 1.1rem; }
#legend { position: absolute; left: 12px; bottom: 22px; z-index: 500; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: .85rem; max-width: 260px; }
@media (max-width: 899px) {
  .twocol { grid-template-columns: 1fr; }
  .right { padding: 28px 20px 56px; border-left: 0; border-top: 1px solid var(--line); }
  .areagrid { grid-template-columns: 1fr; grid-template-areas: "form" "map" "results"; }
  .mapcol { position: relative; top: 0; height: 420px; border-left: 0; margin-top: 24px; }
  .form, .results, .left { padding-left: 20px; padding-right: 20px; }
}

/* ask page */
.section-h { font-size: 1rem; font-weight: 700; margin: 2.4rem 0 .3rem; }
.examples { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
.examples button { text-align: left; min-height: 48px; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); padding: .75rem 0; cursor: pointer; }
.examples button:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.examples mark { background: none; color: var(--muted); font-style: italic; }
.shortcuts { border-bottom: 1px solid var(--line); }
.shortcuts button { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); padding: .85rem 0; cursor: pointer; }
.shortcuts button:hover b { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
.shortcuts span { color: var(--muted); font-size: .92rem; text-align: right; }

/* map layer switches */
.layers { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin: .2rem 0 0; padding: 0; border: 0; }
.layers legend { font-weight: 700; padding: 0; margin-bottom: .3rem; }
.layers label { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 0; font-weight: 400; cursor: pointer; }
.layers input { width: 20px; height: 20px; accent-color: var(--blue); flex: none; margin: 0; }
@media (max-width: 380px) { .layers { grid-template-columns: 1fr; } }
.pin { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 2px; background: var(--ink); color: #fff; font-size: .7rem; font-weight: 800; line-height: 1; border: 2px solid #fff; outline: 1px solid var(--ink); }
.pin.stop { min-width: 16px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); outline: 0; }
.pm { background: none; border: 0; }
.pm .pin { width: 100%; height: 100%; font-size: 11px; }
.place { padding: 14px 0; border-top: 1px solid var(--line); }
.place .kind { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.place .name { font: inherit; font-weight: 700; font-size: 1.1rem; color: var(--ink); background: none; border: 0; padding: 0; margin: 4px 0 2px; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.place .name:hover { color: var(--blue); text-decoration-color: var(--blue); }
.place .how { margin: 4px 0 0; }
.place .others { font-size: .9rem; color: var(--muted); margin-top: 4px; }

/* answers and results */
.turn { border-top: 1px solid var(--line); padding: 1.1rem 0; margin-top: 1.1rem; }
.you { font-weight: 700; margin-bottom: .5rem; }
.steps { margin: .2rem 0 .8rem; padding-left: 1.2rem; color: var(--muted); font-size: .95rem; }
.answer { font-size: 1.1rem; white-space: pre-wrap; }
.block { padding: 22px 0; border-top: 1px solid var(--line); }
.split { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.row2 { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.row2:last-child { border-bottom: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .5rem .3rem; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: .9rem; color: var(--muted); }
.up { color: var(--heat); font-weight: 700; }
.good { color: var(--good); font-weight: 700; }
.src { font-size: .85rem; color: var(--muted); }
details.grp { border-top: 1px solid var(--line); }
details.grp:last-of-type { border-bottom: 1px solid var(--line); }
details.grp > summary, details.more > summary { min-height: 52px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; }
details.more > summary { color: var(--link); min-height: 46px; font-weight: 600; }
.count { color: var(--muted); font-weight: 400; }
.route { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.chip { flex: none; min-width: 58px; min-height: 42px; font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--ink); border-radius: var(--r); cursor: pointer; }
.chip:hover { background: var(--bg); }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.route .name { font-weight: 700; }
.route .meta { font-size: .92rem; color: var(--muted); }
.route .change { font-size: .95rem; margin-top: 4px; }
.gone { border: 1px solid var(--line-2); border-radius: var(--r); padding: .8rem 1rem; margin-top: .8rem; background: var(--surface); }
.gone li { margin: .3rem 0; }
.ev { display: flex; gap: 14px; }
.ev .d { flex: none; width: 92px; text-align: right; padding-top: 2px; }
.ev .d b { display: block; font-size: 1.5rem; line-height: 1.1; }
.ev .d span { color: var(--muted); font-size: .92rem; }
.ev .rail { flex: none; width: 20px; position: relative; }
.ev .rail::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: var(--line-2); }
.ev:last-child .rail::before { bottom: auto; height: 18px; }
.ev .rail::after { content: ""; position: absolute; left: 4px; top: 8px; width: 12px; height: 12px; background: var(--blue); }
.ev .body { flex: 1; min-width: 0; padding-bottom: 28px; }
.ev h3 { margin: 0 0 4px; font-size: 1.15rem; line-height: 1.3; }
.viewswitch { display: inline-flex; border: 1px solid var(--ink); border-radius: var(--r); margin: 1rem 0 .4rem; }
.viewswitch button { min-height: 44px; padding: 0 1.2rem; font: inherit; font-weight: 600; color: var(--ink); background: transparent; border: 0; cursor: pointer; }
.viewswitch button + button { border-left: 1px solid var(--ink); }
.viewswitch button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.sincetable td:nth-child(n+2), .sincetable th:nth-child(n+2) { white-space: nowrap; }
.verdict { padding: 20px 22px; border: 2px solid var(--ink); border-radius: var(--r); background: #fff; }
.verdict h2 { font-size: 1.5rem; margin: 0 0 6px; }
.verdict.good h2 { color: var(--good); } .verdict.warn h2 { color: #8a5a00; } .verdict.bad h2 { color: var(--heat); }
.right ol { padding-left: 1.3rem; } .right ol li { margin: .4rem 0; }
.legal { max-width: 1100px; margin: 0 auto; padding: 18px 20px 28px; font-size: .85rem; line-height: 1.5; color: var(--muted); border-top: 1px solid var(--line); }
.legal p { margin: 0 0 .4rem; }
.legal a { color: var(--muted); }
.legal a:hover { color: var(--ink); }
@media print { .top, .left, .form, .mapcol, button, .tabs, .legal, .layers { display: none !important; } body, .right { background: #fff; padding: 0; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="/" id="home-link">
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 L15 21 L5 21 Z" fill="#1D5FD1"/><path d="M17 8 L17 21 L25 21 Z" fill="#12303A" opacity=".55"/><path d="M3 24 L27 24 L24 28 L6 28 Z" fill="#12303A"/></svg>
      Sail-by
    </a>
    <div class="tabs" role="tablist" data-i18n-aria="nav">
      <button class="tab" role="tab" id="t-ask" aria-selected="false"><span class="long" data-i18n="tab_ask"></span><span class="short" data-i18n="tab_ask_s"></span></button>
      <button class="tab" role="tab" id="t-area" aria-selected="false"><span class="long" data-i18n="tab_area"></span><span class="short" data-i18n="tab_area_s"></span></button>
      <button class="tab" role="tab" id="t-since" aria-selected="false"><span class="long" data-i18n="tab_since"></span><span class="short" data-i18n="tab_since_s"></span></button>
      <button class="tab" role="tab" id="t-curfew" aria-selected="false"><span class="long" data-i18n="tab_curfew"></span><span class="short" data-i18n="tab_curfew_s"></span></button>
    </div>
    <div class="langs" role="group" aria-label="Language / Idioma / Lang">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="es" lang="es">Español</button>
      <button type="button" data-lang="ht" lang="ht">Kreyòl</button>
    </div>
  </div>
</header>
<div id="data-notice" class="notice" hidden></div>

<!-- LANDING -->
<section id="p-home" data-i18n-aria="start">
  <div class="hero">
    <svg class="map" id="map-bg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="hero-in">
      <h1><span class="sr" id="hero-sr"></span><span class="rot" id="hero-rot" aria-hidden="true"></span></h1>
      <p class="lead" data-i18n="hero_lead"></p>
    </div>
  </div>
  <div class="options">
    <button type="button" data-go="ask"><span class="num">01</span><div><b data-i18n="tab_ask"></b><span data-i18n="opt_ask"></span></div></button>
    <button type="button" data-go="area"><span class="num">02</span><div><b data-i18n="tab_area"></b><span data-i18n="opt_area"></span></div></button>
    <button type="button" data-go="since"><span class="num">03</span><div><b data-i18n="tab_since"></b><span data-i18n="opt_since"></span></div></button>
    <button type="button" data-go="curfew"><span class="num">04</span><div><b data-i18n="tab_curfew"></b><span data-i18n="opt_curfew"></span></div></button>
  </div>
</section>

<!-- ASK A QUESTION -->
<section id="p-ask" role="tabpanel" aria-labelledby="t-ask" hidden>
  <div class="askwrap">
    <h1 data-i18n="ask_h1"></h1>
    <p class="lead" data-i18n="ask_lead"></p>
    <label for="ask" data-i18n="ask_label"></label>
    <textarea id="ask" rows="3" maxlength="500" data-i18n-ph="ask_ph"></textarea>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:.7rem">
      <button class="primary" id="ask-go" type="button" data-i18n="ask_btn"></button>
      <button class="plain" id="ask-reset" type="button" hidden data-i18n="ask_reset"></button>
    </div>
    <div id="home-extra">
      <h2 class="section-h" data-i18n="ex_h"></h2>
      <div class="examples" id="examples"></div>
      <p class="hint" style="margin-top:.6rem" data-i18n="ex_hint"></p>
      <h2 class="section-h" data-i18n="go_h"></h2>

  document.querySelectorAll("[data-go-link]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); openTab(a.dataset.goLink); }));
  $("#examples").innerHTML = t("examples").map((s) => `<button type="button">${esc(s).replace("{b}", `<mark>${esc(t("blank"))}</mark>`)}</button>`).join("");
  document.querySelectorAll("#examples button").forEach((b) => (b.onclick = () => { $("#ask").value = b.textContent; $("#ask").focus(); selectBlank(); }));

function setLang(l) {
  if (!STR[l] || l === LANG) return;
  LANG = l;
  try { localStorage.setItem("sailby-lang", l); } catch (e) { /* not saved, still works */ }
  applyStatic();

}

/* landing headline: rotates English, Spanish, Kreyòl. Screen readers get one fixed line (#hero-sr). */
const Hero = {
  timer: null, i: 0,
  build() {
    const order = [LANG, ...["en", "es", "ht"].filter((l) => l !== LANG)];
    $("#hero-rot").innerHTML = order.map((l, i) =>
      `<span lang="${l}" class="${i === 0 ? "on" : ""}">${esc(HERO[l][0])}<br><span class="accent">${esc(HERO[l][1])}</span></span>`).join("");
    this.i = 0;

  restart() {

      const spans = $("#hero-rot").children;

    }, 3500);

function tabFromHash() { const h = location.hash.slice(1); return TABS.includes(h) ? h : "home"; }
function openTab(which, remember = true) {
  state.tab = which;
  for (const tb of TABS) { $("#p-" + tb).hidden = tb !== which; const b = $("#t-" + tb); if (b) b.setAttribute("aria-selected", String(tb === which)); }
  if (which === "area") Maps.refresh();

  if (which === "home") drawMap();

/* ---------- landing background: the real shape of Miami, with bus routes tracing themselves ---------- */
async function drawMap() {
  const svg = $("#map-bg");
  if (svg.dataset.drawn) return;
  let d;
  try { d = await api("/api/lines"); } catch (e) { return; }
  if (svg.dataset.drawn) return;
  svg.dataset.drawn = "1";
  const [s, w, n, e] = d.bbox, k = Math.cos(((s + n) / 2) * Math.PI / 180);
  const W = 1000, H = Math.round(W * (n - s) / ((e - w) * k));
  const X = (lon) => (((lon - w) / (e - w)) * W).toFixed(1), Y = (lat) => (((n - lat) / (n - s)) * H).toFixed(1);
  // Show downtown Miami (with Little Havana, Overtown, and the coast), not the whole bay.
  // On wide screens downtown sits to the right of the headline; on narrow ones it's in the middle.
  const frame = () => {
    const box = svg.getBoundingClientRect(), aspect = box.width / Math.max(1, box.height);
    let cx, lonSpan, latSpan;
    if (aspect > 1.3) { cx = -80.21; lonSpan = 0.096; latSpan = lonSpan * k / aspect; }
    else { cx = -80.199; latSpan = 0.05; lonSpan = Math.min(0.096, latSpan * aspect / k); latSpan = lonSpan * k / aspect; }
    const cy = 25.776, x0 = +X(cx - lonSpan / 2), x1 = +X(cx + lonSpan / 2), y0 = +Y(cy + latSpan / 2), y1 = +Y(cy - latSpan / 2);
    svg.setAttribute("viewBox", `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1 - x0).toFixed(1)} ${(y1 - y0).toFixed(1)}`);
  };
  const path = (pts) => "M" + pts.map(([la, lo]) => X(lo) + "," + Y(la)).join("L");
  const NS = "http://www.w3.org/2000/svg";
  const add = (tag, attrs, parent = svg) => { const el = document.createElementNS(NS, tag); for (const [a, v] of Object.entries(attrs)) el.setAttribute(a, v); parent.appendChild(el); return el; };
  // just the shapes: land, water, river, causeways, bus routes. No place names.
  for (const poly of d.land) add("path", { d: path(poly) + "Z", class: "land" });
  for (const r of d.river) add("path", { d: path(r), class: "river" });
  for (const c of d.causeways) add("path", { d: path(c), class: "road" });
  // Bus routes draw themselves in, wipe away, and start again, for as long as the page is open.
  // Each route starts partway through its 20-second cycle (a negative delay), so lines are already
  // showing and moving the moment the page loads, and the routes stay out of step with each other.
  d.lines.forEach((line, i) => {
    const p = add("path", { d: path(line), class: "bus" });
    p.style.setProperty("--len", Math.ceil(p.getTotalLength()) + "px");
    p.style.setProperty("--delay", (-((i * 7.3) % 20)).toFixed(2) + "s");
  });
  frame();
  new ResizeObserver(frame).observe(svg);
}

    for (const r of routes) for (const shape of r.shapes) {
      const p = shape.map(([a, b]) => ({ lat: a, lng: b }));
      for (const [color, weight] of [["#ffffff", 10], [BLUE, 5]]) {
        const pl = new google.maps.Polyline({ map: this.g, path: p, strokeColor: color, strokeWeight: weight, strokeOpacity: 0, clickable: false });
        this.items.push(pl); (this.lines[r.route] ||= []).push(pl);
      }
    }
    for (const s of stops) {
      const o = new google.maps.Circle({ map: this.g, center: { lat: s.lat, lng: s.lon }, radius: DOT.base.g, clickable: false, zIndex: 50 });
      const d = { o, routes: s.routes }; this.items.push(o); this.dots.push(d); this.styleDot(d, DOT.base);
    }
    this.g.fitBounds(circle.getBounds(), 20);
  },
  showOsm(lat, lon, meters, stops, routes) {
    if (!this.g) {
      this.g = L.map("map-leaflet");
      const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
      const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(this.g);
      const sat = L.layerGroup([
        L.tileLayer(esri + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }),
        L.tileLayer(esri + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
        L.tileLayer(esri + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
      ]);
      this.base = { street, sat };
      this.setBaseNames();
    }
    this.g.invalidateSize();
    this.g.setView([lat, lon], 14);
    this.clear();
    const circle = L.circle([lat, lon], { radius: meters, color: INK, weight: 2, opacity: 0.8, dashArray: "6 6", fillOpacity: 0.04, interactive: false }).addTo(this.g);
    this.ring = circle;
    this.items.push(circle, L.marker([lat, lon], { zIndexOffset: 1000 }).addTo(this.g).bindTooltip(t("the_address")));
    for (const r of routes) for (const shape of r.shapes) {
      for (const [color, weight] of [["#ffffff", 10], [BLUE, 5]]) {
        const pl = L.polyline(shape, { color, weight, opacity: 0, interactive: false }).addTo(this.g);
        this.items.push(pl); (this.lines[r.route] ||= []).push(pl);
      }
    }
    for (const s of stops) {
      const o = L.circleMarker([s.lat, s.lon], {}).addTo(this.g).bindTooltip(`${s.name} (${t("bus_stop")})`);
      const d = { o, routes: s.routes }; this.items.push(o); this.dots.push(d); this.styleDot(d, DOT.base);
    }
    this.g.fitBounds(L.latLng(lat, lon).toBounds(meters * 2), { padding: [20, 20] });
  },
  setBaseNames() {  // the street/satellite switch, in the current language
    if (this.kind !== "osm" || !this.g) return;
    if (this.view) this.view.remove();
    this.view = L.control.layers({ [t("street_map")]: this.base.street, [t("satellite")]: this.base.sat }, null, { collapsed: false }).addTo(this.g);
  },
  styleDot(d, s) {
    if (this.kind === "google") d.o.setOptions({ fillColor: s.fill, strokeColor: s.edge, strokeWeight: s.w, fillOpacity: s.op, strokeOpacity: s.op, radius: s.g });
    else d.o.setStyle({ fillColor: s.fill, color: s.edge, weight: s.w, fillOpacity: s.op, opacity: s.op, radius: s.osm });
  },
  setStops(on) {
    this.stopsOn = on;
    for (const d of this.dots) {
      if (this.kind === "google") d.o.setVisible(on);
      else if (on) d.o.addTo(this.g); else d.o.remove();
    }
  },
  focus(route) {
    const google = this.kind === "google";
    for (const [name, lines] of Object.entries(this.lines)) for (const pl of lines) {
      const op = route && name === route ? 0.95 : 0;
      google ? pl.setOptions({ strokeOpacity: op }) : pl.setStyle({ opacity: op });
    }
    if (route && !this.stopsOn) this.setStops(true);
    for (const d of this.dots) {
      if (!route) this.styleDot(d, DOT.base);
      else if (d.routes.includes(route)) this.styleDot(d, DOT.hit);
      else this.styleDot(d, DOT.dim);
    }
  },
  setPlaces(places, layers, fit) {
    this.placeMarks.forEach((m) => this.drop(m.m)); this.placeMarks = [];
    if (!this.g || !places || !places.available) return;
    const pts = [];
    for (const [kind, v] of Object.entries(places.kinds)) {
      if (!layers.has(kind)) continue;
      v.items.forEach((p, i) => {
        const tip = p.name + (p.address ? ", " + p.address : "");
        let m;
        if (this.kind === "google") {
          m = new google.maps.Marker({ map: this.g, position: { lat: p.lat, lng: p.lon }, title: tip, zIndex: 900 - i,
            label: { text: LETTER[kind] || "?", color: "#fff", fontWeight: "800", fontSize: "11px" },
            icon: { path: "M -12 -12 L 12 -12 L 12 12 L -12 12 Z", fillColor: INK, fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2, scale: 1 } });
        } else {
          m = L.marker([p.lat, p.lon], { zIndexOffset: 900 - i, icon: L.divIcon({ className: "pm", html: pinHtml(kind), iconSize: [26, 26], iconAnchor: [13, 13] }) })
            .bindTooltip(tip).addTo(this.g);
        }
        this.placeMarks.push({ m, key: kind + ":" + i });
        if (i === 0) pts.push([p.lat, p.lon]);
      });
    }
    if (!fit || !pts.length || !this.home) return;
    // zoom out just enough to show the closest one of each kind
    const b = this.ring.getBounds();
    if (this.kind === "google") { pts.forEach(([a, c]) => b.extend({ lat: a, lng: c })); this.g.fitBounds(b, 30); }
    else { pts.forEach((p) => b.extend(p)); this.g.fitBounds(b, { padding: [30, 30] }); }
  },
  goTo(kind, i) {
    const pm = this.placeMarks.find((x) => x.key === kind + ":" + i);
    if (!pm) return;
    if (this.kind === "google") { this.g.panTo(pm.m.getPosition()); this.g.setZoom(16); }
    else { this.g.setView(pm.m.getLatLng(), 16); pm.m.openTooltip(); }
  },
};

/* ---------- result pieces ---------- */
function spark(points) {
  if (!points || points.length < 2) return "";
  const W = 90, H = 56, P = 6, xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x) => P + ((x - x0) / (x1 - x0 || 1)) * (W - 2 * P), py = (y) => H - P - ((y - y0) / (y1 - y0 || 1)) * (H - 2 * P);
  const d = points.map((p, i) => (i ? "L" : "M") + px(p[0]).toFixed(1) + " " + py(p[1]).toFixed(1)).join(" ");
  const last = points[points.length - 1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("spark_label", { a: money(points[0][1]), b: money(last[1]) }))}" style="flex:none"><path d="${d}" fill="none" stroke="${BLUE}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${px(last[0])}" cy="${py(last[1])}" r="4" fill="${BLUE}"/></svg>`;
}
function missing(what) { return `<p>${t("missing", { w: what })}</p><p class="hint">${t("missing_hint")}</p>`; }
function goneBlock(list) {
  if (!list || !list.length) return "";
  return `<div class="gone"><strong>${t("gone_h")}</strong><ul>` + list.map((g) => `<li><strong>${esc(g.route)}.</strong> ${esc(tr(g.instead))}</li>`).join("") + `</ul></div>`;
}
const GROUP_IDS = [["local", true], ["rail", false], ["express", false], ["night", false]];
function busGroup(r) { if (r.type !== 3) return "rail"; if (/owl/i.test(r.name)) return "night"; if (/max|express|park & ride/i.test(r.name)) return "express"; return "local"; }
function routeRow(r) {
  return `<div class="route"><button class="chip" type="button" data-route="${esc(r.route)}" aria-pressed="false" aria-label="${esc(t("show_route", { r: r.route }))}">${esc(r.route)}</button>
    <div><div class="name">${esc(r.name || t("route_n", { r: r.route }))}</div><div class="meta">${t("closest_stop", { n: r.closest_miles })}</div>
    ${r.change ? `<div class="change"><strong>${t("changed")}</strong> ${esc(tr(r.change))}</div>` : ""}</div></div>`;
}
function busBlock(b, gone, miles) {
  if (!b || !b.available) return `<h2>${t("buses_h")}</h2>` + missing(t("w_bus"));
  let h = `<h2>${t("buses_within", { m: t("mi")[miles].toLowerCase() })}</h2>`;
  if (!b.routes.length) h += `<p>${t("no_stops_close")}</p>`;
  else {
    const by = {}; for (const r of b.routes) (by[busGroup(r)] ||= []).push(r);
    h += `<p class="hint">${t("tap_route")}</p>` + GROUP_IDS.filter(([id]) => by[id]).map(([id, open]) => {
      const [title, hint] = t("groups")[id], list = by[id], first = list.slice(0, 6), more = list.slice(6);
      return `<details class="grp"${open ? " open" : ""}><summary>${title} <span class="count">(${list.length})</span></summary><p class="hint">${hint}</p>${first.map(routeRow).join("")}
        ${more.length ? `<details class="more"><summary>${t("show_more", { n: more.length })}</summary>${more.map(routeRow).join("")}</details>` : ""}</details>`;
    }).join("");
  }
  return h + goneBlock(gone) + `<p class="src">${t("bus_src", { a: esc(b.source_url), b: esc(b.changes_url) })}</p>`;
}

/* places: the switches, the map pins, and the "closest" list */
function renderLayers() {
  const kinds = (state.cfg && state.cfg.place_kinds) || {};
  const opts = ["stops", ...Object.keys(kinds)];
  $("#layers").innerHTML = `<legend>${t("show_on_map")}</legend>` + opts.map((k) =>
    `<label><input type="checkbox" value="${esc(k)}"${state.layers.has(k) ? " checked" : ""}> ${pinHtml(k)} ${esc(k === "stops" ? t("stops") : t("kinds")[k] || kinds[k])}</label>`).join("");
  $("#layers").querySelectorAll("input").forEach((c) => (c.onchange = () => {
    c.checked ? state.layers.add(c.value) : state.layers.delete(c.value);
    if (c.value === "stops") return Maps.setStops(c.checked);
    Maps.setPlaces(state.places, state.layers, c.checked);
    $("#c-places").innerHTML = placesBlock(state.places);
  }));
}
function placesBlock(p) {
  if (!p || !p.available) return `<h2>${t("closest")}</h2>` + missing(t("w_places"));
  const on = Object.entries(p.kinds).filter(([k]) => state.layers.has(k));
  let h = `<h2>${t("closest")}</h2>`;
  if (!on.length) return h + `<p>${t("turn_on")}</p>`;
  h += on.map(([k, v]) => {
    const [first, ...rest] = v.items;
    if (!first) return "";
    const how = first.miles <= 0.6 ? t("walk_min", { n: Math.max(1, first.walk_minutes) })
      : first.bus ? t("take_bus", { r: esc(first.bus.route), a: esc(first.bus.board), b: esc(first.bus.off) })
      : t("no_one_bus");
    return `<div class="place"><div class="kind">${pinHtml(k)} ${esc(t("one")[k] || v.label)}</div>
      <button class="name" type="button" data-goto="${esc(k)}:0">${esc(first.name)}</button>
      <div class="hint">${first.address ? esc(first.address) + " · " : ""}${t("mi_away", { n: first.miles })}${first.phone ? " · " + esc(first.phone) : ""}</div>
      <p class="how">${how}</p>
      ${rest.length ? `<div class="others">${t("also")} ${rest.slice(0, 2).map((x, i) => `<a href="#" data-goto="${esc(k)}:${i + 1}">${esc(x.name)}</a> (${x.miles} mi)`).join(", ")}</div>` : ""}</div>`;
  }).join("");
  return h + srcLine("OpenStreetMap", p.source_url) + `<p class="src">${t("places_note")}</p>`;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-goto]");
  if (!el) return;
  e.preventDefault();
  const [k, i] = el.dataset.goto.split(":");
  Maps.goTo(k, +i);
  if (window.innerWidth < 900) $(".mapcol").scrollIntoView({ behavior: "smooth" });
});

/* ---------- WHAT'S CLOSE BY ---------- */
function areaLoading() {
  $("#results").hidden = false;
  $("#where").textContent = t("looking_up");
  for (const [id, n] of [["#c-places", 4], ["#c-buses", 5]]) $(id).innerHTML = skel(n);
}
function bindChips() {
  document.querySelectorAll(".chip").forEach((c) => (c.onclick = () => {
    const on = c.getAttribute("aria-pressed") !== "true";
    document.querySelectorAll(".chip").forEach((o) => o.setAttribute("aria-pressed", "false"));
    c.setAttribute("aria-pressed", String(on)); Maps.focus(on ? c.dataset.route : null);
    if (on) { state.layers.add("stops"); const s = $('#layers input[value="stops"]'); if (s) s.checked = true; }
    if (window.innerWidth < 900 && on) $(".mapcol").scrollIntoView({ behavior: "smooth" });
  }));
}
function placeName(place) { return place.areaMiddle ? t("middle", { a: place.areaMiddle }) : place.matched; }
// draws the text part of the results; the map is drawn once in loadArea
function renderArea(a, first) {
  const { d, place } = a;
  $("#where").innerHTML = t("showing", { p: esc(placeName(place)) }) + (d.area ? t("showing_in", { a: esc(d.area.name) }) : t("showing_out"));
  renderLayers();
  $("#c-places").innerHTML = placesBlock(d.places);
  $("#c-buses").innerHTML = busBlock(d.buses, d.gone, state.radius);
  bindChips();
  applyStatic();
  if (!first) { Maps.setBaseNames(); Maps.focus(null); }
}
async function loadArea(place) {
  showError("#area-error", "");
  const go = $("#addr-go"); go.disabled = true; go.textContent = t("looking");
  areaLoading();
  try {
    const d = await api(`/api/nearby?lat=${place.lat}&lon=${place.lon}&zip=${encodeURIComponent(place.zip || "")}&radius=${state.radius}`);
    state.place = { ...place, matched: placeName(place), radius: state.radius, area_id: d.area ? d.area.id : "" };
    state.areaId = d.area ? d.area.id : ""; state.zip = place.zip || ""; state.places = d.places;
    state.lastArea = { d, place };
    renderArea(state.lastArea, true);
    await Maps.init(state.cfg.maps_key);
    const routes = d.buses.available ? d.buses.routes : [];
    try { Maps.show(place.lat, place.lon, state.radius, d.buses.available ? d.buses.stops : [], routes); Maps.setStops(state.layers.has("stops")); Maps.setPlaces(d.places, state.layers, false); } catch (err) { console.error(err); }
    syncSinceArea();

}
$("#addr-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();

  const go = $("#addr-go"); go.disabled = true; go.textContent = t("looking");
  areaLoading();
  try { await loadArea(await api("/api/geocode?q=" + encodeURIComponent(q))); } catch (e) { showError("#area-error", e.message); $("#results").hidden = true; }
  go.disabled = false; go.textContent = t("show_me");

function eventRow(e) {

function sinceTimeline(f) {

  if (still.length) h += `<h3 style="margin-top:1.4rem">${t("still_h")}</h3>` + still.map((e) => `<div class="row2" style="display:block"><strong>${esc(tr(e.title))}</strong> ${esc(tr(e.detail))} <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source)}</a></div>`).join("");

function sinceTable(f, zip) {
  const w = f.min_wage, r = f.rent, p = f.prices;
  const pct = (a, b) => { const v = Math.round((b / a - 1) * 100); return `<span class="${v > 0 ? "up" : "good"}">${v > 0 ? "+" : ""}${v}%</span>`; };
  const rows = [];
  if (w.now) rows.push([`${t("r_wage")} <div class="hint">${t("r_wage_s")}</div>`, w.then ? money2(w.then) : t("under"), money2(w.now), w.then ? pct(w.then, w.now) : ""]);
  if (r && r.available && r.then) rows.push([`${t("r_rent")} <div class="hint">${t("r_rent_s", { z: esc(r.zip || zip), a: r.then_year, b: r.now_year })}</div>`, money(r.then), money(r.now), pct(r.then, r.now)]);
  if (p && p.available) for (const i of p.items) {

    else rows.push([`${esc(tr(i.label))} <div class="hint">${esc(tr(i.area))}</div>`, money2(i.then), money2(i.now), pct(i.then, i.now)]);

  let h = `<table class="sincetable" style="margin-top:1rem"><thead><tr><th>${t("th_what")}</th><th>${t("th_then")}</th><th>${t("th_now")}</th><th>${t("th_change")}</th></tr></thead><tbody>` +
    rows.map((c) => `<tr>${c.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
  if (r && r.available && r.then) h += `<div class="split" style="margin-top:1rem"><p class="hint" style="margin:0">${t("rent_from", { a: r.then_year, b: r.now_year })}</p>${spark(r.history.filter((x) => x[0] >= r.then_year))}</div>`;
  if (r && r.clamped) h += `<p class="hint">${t("rent_clamped", { y: r.first_year })}</p>`;
  if (p && p.clamped) h += `<p class="hint">${t("prices_clamped")}</p>`;
  h += (r && r.available ? `<p class="src">${esc(tr(r.note))}</p>` + srcLine(r.source, r.source_url) : "") + (p && p.available ? srcLine(p.source, p.source_url) : "") + srcLine(t("wage_src"), w.source_url);
  return h;
}
function renderSince(f, zip) {
  state.sinceLast = { f, zip };

/* ---------- HOME BY CURFEW ---------- */
function renderCurfew(r) {
  const cls = { ok: "good", tight: "warn", late: "bad", no_bus: "bad", walk: "warn" }[r.status] || "neutral";
  let h = `<div class="verdict ${cls}"><h2>${esc(r.headline)}</h2>${r.last_bus_line ? `<p style="margin:0">${esc(r.last_bus_line)}</p>` : ""}</div>`;
  if (r.plan && r.plan.length) h += `<h3 style="margin-top:1.6rem">${t("how_h")}</h3><ol>${r.plan.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`;
  h += `<h3>${t("walking_h")}</h3><p>${esc(r.walk_line)}</p>`;
  if (["tight", "late", "no_bus", "no_direct", "walk"].includes(r.status)) h += `<h3>${t("todo_h")}</h3><p>${esc(r.advice)}</p>`;
  h += `<p class="hint" style="margin-top:1.4rem">${r.notes.map(esc).join("<br>")}</p><p><button class="plain" type="button" onclick="window.print()">${t("print")}</button></p>`;
  $("#c-out").innerHTML = h;
}
async function runCurfew(c) {
  state.lastCurfew = c;
  const r = await api(`/api/curfew?lat1=${c.lat1}&lon1=${c.lon1}&lat2=${c.lat2}&lon2=${c.lon2}&end=${c.end}&curfew=${c.curfew}&lang=${LANG}`);
  renderCurfew(r);
}
$("#curfew-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const from = $("#c-from").value.trim(), home = $("#c-home").value.trim(), end = $("#c-end").value, cur = $("#c-time").value;
  if (from.length < 3 || home.length < 3) return showError("#c-error", t("need_both"));
  if (!end || !cur) return showError("#c-error", t("need_times"));
  showError("#c-error", "");
  const go = $("#c-go"); go.disabled = true; go.textContent = t("checking");
  const before = $("#c-out").innerHTML; $("#c-out").innerHTML = skel(5);
  try {
    const a = await api("/api/geocode?q=" + encodeURIComponent(from)), b = await api("/api/geocode?q=" + encodeURIComponent(home));
    await runCurfew({ lat1: a.lat, lon1: a.lon, lat2: b.lat, lon2: b.lon, end, curfew: cur });
  } catch (e) { showError("#c-error", e.message); $("#c-out").innerHTML = before; }
  go.disabled = false; go.textContent = t("c_btn");
});

/* ---------- ASK A QUESTION (the agent) ---------- */
const chat = [];
function context() {
  return { place: state.place ? { lat: state.place.lat, lon: state.place.lon, zip: state.place.zip || "", matched: state.place.matched, radius: state.radius, area_id: state.areaId } : null,
           since: state.sinceDate ? { date: state.sinceDate, area_id: state.sinceArea, zip: state.zip } : null };
}
async function ask(text) {
  const q = (text ?? $("#ask").value).trim();
  if (q.length < 3) return;
  if (q.includes(t("blank"))) { $("#ask").focus(); return selectBlank(); }
  const btn = $("#ask-go"); btn.disabled = true; btn.textContent = t("ask_working");
  const turn = document.createElement("div"); turn.className = "turn";
  turn.innerHTML = `<p class="you">${esc(q)}</p>${skel(3)}<p class="hint">${t("looking_ai")}</p>`;
  $("#thread").appendChild(turn); $("#ask").value = ""; $("#home-extra").hidden = true; $("#ask-reset").hidden = false;
  turn.scrollIntoView({ behavior: "smooth", block: "nearest" });
  try {
    const r = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q, language: LANG_NAME[LANG], history: chat.slice(-8), context: context() }) });
    chat.push({ role: "user", content: q }, { role: "assistant", content: r.answer });
    const acts = [];
    if (r.place) acts.push(["map", r.show && r.show.length ? t("act_map_places") : t("act_map")]);
    if (r.since) acts.push(["since", t("act_since")]);
    if (r.curfew) acts.push(["curfew", t("act_curfew")]);
    turn.innerHTML = `<p class="you">${esc(q)}</p>` + (r.steps.length ? `<p class="hint" style="margin:0">${t("checked")}</p><ul class="steps">${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : "") +
      `<p class="answer">${esc(r.answer)}</p>` + (acts.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${acts.map(([k, l]) => `<button class="plain" type="button" data-act="${k}">${esc(l)}</button>`).join("")}</div>` : "") +
      `<p class="hint" style="margin-top:.8rem">${t("followup")}</p>`;
    if (r.place) {
      state.radius = r.place.radius || state.radius; setSegment($("#radius"), state.radius); $("#addr").value = "";
      (r.show || []).forEach((k) => state.layers.add(k));
      turn.querySelector('[data-act="map"]').onclick = async () => { openTab("area"); await loadArea({ lat: r.place.lat, lon: r.place.lon, zip: r.place.zip, matched: r.place.matched }); if (r.show && r.show.length) Maps.setPlaces(state.places, state.layers, true); };
      state.place = { ...r.place }; state.areaId = r.place.area_id || ""; state.zip = r.place.zip || "";
    }
    if (r.since) {
      state.sinceArea = r.since.area_id || state.sinceArea; state.sinceDate = r.since.date; $("#date").value = r.since.date; syncSinceArea();
      try { renderSince(await api(`/api/since?date=${r.since.date}&area=${state.sinceArea || ""}&zip=${r.since.zip || ""}`), r.since.zip || ""); } catch (e) { /* the answer stands */ }
      turn.querySelector('[data-act="since"]').onclick = () => openTab("since");
    }
    if (r.curfew) {
      const c = r.curfew; $("#c-from").value = c.from; $("#c-home").value = c.home; $("#c-end").value = c.end; $("#c-time").value = c.curfew;
      try { await runCurfew({ lat1: c.lat1, lon1: c.lon1, lat2: c.lat2, lon2: c.lon2, end: c.end, curfew: c.curfew }); } catch (e) { /* the answer stands */ }
      turn.querySelector('[data-act="curfew"]').onclick = () => openTab("curfew");
    }
  } catch (e) {
    turn.innerHTML = `<p class="you">${esc(q)}</p><div class="error">${esc(e.message)}</div>`;
    $("#ask").value = q;
  }
  btn.disabled = false; btn.textContent = t("ask_btn");
  turn.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
// tapping an example fills the box and highlights the blank, so typing replaces it
function selectBlank() {
  const box = $("#ask"), b = t("blank"), i = box.value.indexOf(b);
  if (i >= 0) box.setSelectionRange(i, i + b.length);
}
$("#ask-go").onclick = () => ask();
$("#ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });
$("#ask-reset").onclick = () => { chat.length = 0; $("#thread").innerHTML = ""; $("#home-extra").hidden = false; $("#ask-reset").hidden = true; $("#ask").focus(); };

/* ---------- start ---------- */
function buildSegments() {
  const cfg = state.cfg;
  segment($("#radius"), [0.5, 1, 2].map((v) => ({ value: v, label: t("mi")[v] })), (v) => { state.radius = Number(v); if (state.lastArea) loadArea(state.lastArea.place); }, state.radius);
  segment($("#area-pick"), cfg.areas.map((a) => ({ value: a.id, label: a.name })), (id) => {
    const a = cfg.areas.find((x) => x.id === id); $("#addr").value = "";
    loadArea({ lat: a.lat, lon: a.lon, zip: a.zips[0], matched: a.name, areaMiddle: a.name });
  }, state.lastArea && state.lastArea.place.areaMiddle ? state.areaId : "");
  segment($("#since-area"), cfg.areas.map((a) => ({ value: a.id, label: a.name })), (id) => { state.sinceArea = id; }, state.sinceArea);
}
applyStatic();
Hero.restart();
openTab(tabFromHash(), false);
(async function start() {
  try { state.cfg = await api("/api/config"); } catch (e) { return; }
  const cfg = state.cfg;
  $("#date").max = cfg.today;
  const miss = ["rent", "prices", "buses", "places"].filter((k) => !cfg.data[k]);
  if (miss.length) { const n = $("#data-notice"); n.hidden = false; n.innerHTML = `<strong>${t("not_loaded")}</strong> ${miss.join(", ")}.`; }
  buildSegments();
  syncSinceArea();
})();
</script>
